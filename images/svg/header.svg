<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">MieSheeeep animated water header</title>
  <desc id="description">An animated blue wave with falling water drops.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="0.55" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.92" />
      <stop offset="1" stop-color="#1e293b" stop-opacity="0.86" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="wave" d="M0 0H1200V68C1050 110 900 36 750 74S450 112 300 68 100 40 0 82Z" />
  </defs>

  <style>
    .wave-back { animation: sway-back 7s ease-in-out infinite alternate; opacity: .28; }
    .wave-front { animation: sway-front 5s ease-in-out infinite alternate; }
    .drop { fill: url(#water); filter: url(#glow); animation: fall 4.8s ease-in infinite; opacity: 0; }
    .drop:nth-of-type(2) { animation-delay: -1.1s; animation-duration: 5.5s; }
    .drop:nth-of-type(3) { animation-delay: -2.7s; animation-duration: 4.2s; }
    .drop:nth-of-type(4) { animation-delay: -.4s; animation-duration: 6.1s; }
    .drop:nth-of-type(5) { animation-delay: -3.6s; animation-duration: 5.1s; }
    .drop:nth-of-type(6) { animation-delay: -2s; animation-duration: 5.8s; }
    .cursor { animation: blink .75s steps(1) infinite; }
    @keyframes sway-front { to { transform: translateX(28px) scaleX(1.03); } }
    @keyframes sway-back { to { transform: translateX(-34px) scaleX(1.05); } }
    @keyframes fall {
      0% { transform: translateY(-15px) scale(.55); opacity: 0; }
      12% { opacity: .9; }
      78% { opacity: .85; }
      100% { transform: translateY(155px) scale(.12); opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .wave-back, .wave-front, .drop, .cursor { animation: none; }
      .drop { opacity: .55; }
    }
  </style>

  <g class="wave-back" fill="#818cf8">
    <use href="#wave" transform="translate(-20 17)" />
  </g>
  <g class="wave-front" fill="url(#water)">
    <use href="#wave" transform="translate(-10 0)" />
  </g>

  <g>
    <path class="drop" d="M145 73C145 73 129 98 129 109a16 16 0 0 0 32 0c0-11-16-36-16-36Z" />
    <path class="drop" d="M335 66C335 66 321 88 321 98a14 14 0 0 0 28 0c0-10-14-32-14-32Z" />
    <path class="drop" d="M520 76C520 76 502 104 502 116a18 18 0 0 0 36 0c0-12-18-40-18-40Z" />
    <path class="drop" d="M705 63C705 63 692 84 692 93a13 13 0 0 0 26 0c0-9-13-30-13-30Z" />
    <path class="drop" d="M900 72C900 72 884 97 884 108a16 16 0 0 0 32 0c0-11-16-36-16-36Z" />
    <path class="drop" d="M1080 67C1080 67 1066 89 1066 99a14 14 0 0 0 28 0c0-10-14-32-14-32Z" />
  </g>

  <rect x="315" y="116" width="570" height="104" rx="18" fill="url(#panel)" stroke="#60a5fa" stroke-opacity=".45" />
  <text x="600" y="162" text-anchor="middle" fill="#f8fafc" font-family="Courier New, monospace" font-size="34" font-weight="700" letter-spacing="5">MieSheeeep</text>
  <text x="600" y="195" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">AI · ALGORITHMS · ALWAYS LEARNING</text>
  <rect class="cursor" x="714" y="171" width="18" height="3" rx="1.5" fill="#67e8f9" />
</svg>
